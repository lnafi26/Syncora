name: Deploy Syncora Backend to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf-space.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out Syncora
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Deploy backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          hf upload "$HF_SPACE_ID" backend . \
            --repo-type=space \
            --delete="*" \
            --exclude=".env" \
            --exclude=".venv/**" \
            --exclude=".syncora_cache/**" \
            --exclude="__pycache__/**" \
            --exclude=".DS_Store" \
            --token="$HF_TOKEN" \
            --commit-message="Deploy Syncora backend from GitHub"